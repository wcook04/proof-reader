name: Check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Poppler, which reads the papers' PDFs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci
        working-directory: web
      - run: npm run test:source
        working-directory: web
      - run: python -m unittest discover -s tests
      # Checks every link and every word of each reading copy against its PDF.
      - name: Check each paper and build its data
        run: |
          for folder in papers/*/; do
            python tools/paper.py check "$(basename "$folder")"
          done
          python tools/paper.py build
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /proof-reader/
      - name: Build the same site from a source archive
        env:
          VITE_BASE_PATH: /proof-reader/
        run: |
          archive="$RUNNER_TEMP/proof-reader-source"
          mkdir -p "$archive"
          git archive HEAD | tar -x -C "$archive"
          test ! -e "$archive/.git"
          npm ci --prefix "$archive/web"
          python "$archive/tools/paper.py" build
          npm run build --prefix "$archive/web"
          diff -qr web/dist "$archive/web/dist"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web/dist
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
