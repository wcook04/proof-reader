name: Publish the rebuilt PhysLib reader
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: scoped-physlib-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify the baseline run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/wcook04/proof-reader/actions/runs/45693945012 --jq \
            '[.head_sha,.head_branch,.conclusion,.path] | @tsv' |
            grep -Fqx "$(printf 'c4ea0b9da9b310ae8dc4851338ad4b9c4dbb4449\tmain\tsuccess\t.github/workflows/pages.yml')"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages
          path: baseline
          github-token: ${{ github.token }}
          run-id: '45693945012'
      - name: Restore the validated generated paper data
        run: |
          mkdir -p baseline/site
          tar -xf baseline/artifact.tar -C baseline/site
          cp -R baseline/site/papers web/public/papers
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci --prefix web && npm run test:source --prefix web
      - name: Rebuild the edited API map and PCP credit records
        run: |
          python tools/paper.py check physlib-gauge-theory
          for paper in pcp-exposition pcp-full-argument pcp-reading-guide pcp-specialist; do
            python tools/paper.py build "$paper"
          done
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /proof-reader/
          PROOF_READER_COMMIT: e9f40087fe6124a79a2b1d4a267559bfb81f9aab
      - name: Check public output
        run: |
          python tools/private_guard.py web/dist
          test -f web/dist/api-maps/physlib-gauge-theory/edition.json
          test -f web/dist/papers/contextual-embeddings/edition.json
          test -f web/dist/papers/coupled-spring/edition.json
          test -f web/dist/pcp-full-argument/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web/dist
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
