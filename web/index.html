<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proof Reader: read a paper beside its Lean proof</title>
    <meta name="description" content="Read a research paper beside its proof in Lean. A graph of the proof moves to the statement you are reading, and a click opens the authors' exact Lean lines." />
    <meta name="theme-color" content="#ebe2d2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#150f1e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://wcook04.github.io/proof-reader/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Proof Reader" />
    <meta property="og:title" content="Proof Reader: read a paper beside its Lean proof" />
    <meta property="og:description" content="A paper on one page and, on the other, a graph of its Lean proof and the authors' Lean lines, linked statement by statement." />
    <meta property="og:url" content="https://wcook04.github.io/proof-reader/" />
    <meta property="og:image" content="https://wcook04.github.io/proof-reader/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A paper on the left page with one sentence highlighted, and on the right the Lean lines linked to that sentence." />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="%BASE_URL%library-redirects.js"></script>
    <script>
      // The chosen theme, before the first paint, so the page never flashes.
      try {
        var stored = localStorage.getItem("proof-reader-theme");
        if (stored === "light" || stored === "dark") document.documentElement.setAttribute("data-theme", stored);
      } catch (error) {}
      // Start loading the selected reader's data while its app loads.
      (function () {
        var slug = /^#\/([^/]+)/.exec(location.hash);
        if (!slug) return;
        var folder = slug[1] === "physlib-gauge-theory" ? "api-maps" : "papers";
        var files = folder === "api-maps" ? ["edition.json"] : ["edition.json", "reading.html"];
        files.forEach(function (name) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "fetch";
          link.crossOrigin = "anonymous";
          link.href = "%BASE_URL%" + folder + "/" + slug[1] + "/" + name;
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <!-- The reader bar's Reading library link, there before the script runs and without it; the app replaces it. -->
    <div id="root"><header class="bar bar--reader"><div class="bar__left"><a class="bar__reader-home bar__library" href="https://wcook04.github.io/library/"><span class="bar__library-long">Reading library</span><span class="bar__library-short">Library</span></a></div></header></div>
    <noscript>This site draws the paper and its Lean proof in the browser and needs JavaScript. The papers and their data are under <a href="%BASE_URL%papers/index.json">papers/</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
